runner = "powershell"

[tools.rot-tools.commands.debug-server]
path = "re-toolkit/tools/binary-ninja/remote-debug/debug-server.sh"
description = "Manage Binary Ninja remote debug servers"
runner = "bash"

[tools.rot-tools.commands."find-class-in-jars.ps1"]
